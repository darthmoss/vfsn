name: "Tier 3 - Weekly Cutover & Finalization"

on:
  schedule:
    # Tuesdays at 3:47 AM EST / 4:47 AM EDT (08:47 UTC) during NFL season months (Sep-Dec, Jan)
    # Scheduled right after ESPN's ~3:30 AM ET weekly rollover with an off-peak minute (:47)
    # to provide a multi-hour buffer against GitHub Actions cron queue delays before Tuesday morning.
    - cron: "47 8 * 9-12,1 2"

  workflow_dispatch:
    inputs:
      year:
        description: "Season year (optional, leave blank to auto-resolve from vffl.leagues)"
        required: false
        type: string
      completed_week:
        description: "Completed week to finalize (optional, leave blank to auto-resolve as current_week - 1)"
        required: false
        type: string

concurrency:
  group: vfsn-tier3-weekly-cutover
  cancel-in-progress: false

jobs:
  run-tier3-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ESPN_LEAGUE_ID_RED: ${{ secrets.ESPN_LEAGUE_ID_RED }}
      ESPN_LEAGUE_ID_BLACK: ${{ secrets.ESPN_LEAGUE_ID_BLACK }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      GITHUB_CRON_SCHEDULE: ${{ github.event.schedule }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Capture Actual Runner Start Time
        id: job_timer
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install espn-api psycopg2-binary python-dotenv requests

      - name: Send Job Start Notification & Write Timing Summary
        run: |
          python scripts/vffl_pipeline_notifier.py start "Tier 3 - Weekly Cutover & Finalization" "${{ steps.job_timer.outputs.start_epoch }}"

      - name: Execute Tier 3 (Weekly Cutover) Pipeline
        run: |
          if [ -n "${{ inputs.year }}" ] && [ -n "${{ inputs.completed_week }}" ]; then
            python scripts/vffl_weekly_pipeline.py "${{ inputs.year }}" "${{ inputs.completed_week }}"
          elif [ -n "${{ inputs.year }}" ]; then
            python scripts/vffl_weekly_pipeline.py "${{ inputs.year }}"
          else
            python scripts/vffl_weekly_pipeline.py
          fi

      - name: Send Job End Notification & Finalize Timing Summary
        if: always()
        run: |
          python scripts/vffl_pipeline_notifier.py end "Tier 3 - Weekly Cutover & Finalization" "${{ steps.job_timer.outputs.start_epoch }}" "${{ job.status }}"

