name: "Tier 2 - Nightly Wire & Injury Sync"

on:
  schedule:
    # 1. Nightly at 1:17 AM EST (06:17 UTC) during NFL season months (Sep-Dec, Jan)
    - cron: "17 6 * 9-12,1 *"
    # 2. Sunday Pre-Kickoff at 12:17 PM EST (17:17 UTC Sunday) — after 11:30 AM ET NFL Inactive Lists
    - cron: "17 17 * 9-12,1 0"
    # 3. Thursday & Monday Pre-Kickoff at 7:17 PM EST (00:17 UTC Fri/Tue) — after 6:45 PM ET Primetime Inactives
    - cron: "17 0 * 9-12,1 5"
    - cron: "17 0 * 9-12,1 2"

  workflow_dispatch:
    inputs:
      year:
        description: "Season year (optional, leave blank to auto-resolve from vffl.leagues)"
        required: false
        type: string
      week:
        description: "Week number (optional, leave blank to auto-resolve from vffl.leagues)"
        required: false
        type: string

concurrency:
  group: vfsn-tier2-wire-injury
  cancel-in-progress: false

jobs:
  run-tier2-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ESPN_LEAGUE_ID_RED: ${{ secrets.ESPN_LEAGUE_ID_RED }}
      ESPN_LEAGUE_ID_BLACK: ${{ secrets.ESPN_LEAGUE_ID_BLACK }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      GITHUB_CRON_SCHEDULE: ${{ github.event.schedule }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Capture Actual Runner Start Time
        id: job_timer
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install espn-api psycopg2-binary python-dotenv requests

      - name: Send Job Start Notification & Write Timing Summary
        run: |
          python scripts/vffl_pipeline_notifier.py start "Tier 2 - Nightly Wire & Injury Sync" "${{ steps.job_timer.outputs.start_epoch }}"

      - name: Execute Tier 2 (Nightly Wire & Injury) Pipeline
        run: |
          if [ -n "${{ inputs.year }}" ] && [ -n "${{ inputs.week }}" ]; then
            python scripts/vffl_wire_injury_pipeline.py "${{ inputs.year }}" "${{ inputs.week }}"
          elif [ -n "${{ inputs.year }}" ]; then
            python scripts/vffl_wire_injury_pipeline.py "${{ inputs.year }}"
          else
            python scripts/vffl_wire_injury_pipeline.py
          fi

      - name: Send Job End Notification & Finalize Timing Summary
        if: always()
        run: |
          python scripts/vffl_pipeline_notifier.py end "Tier 2 - Nightly Wire & Injury Sync" "${{ steps.job_timer.outputs.start_epoch }}" "${{ job.status }}"

