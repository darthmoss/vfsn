name: "Tier 2 - Nightly Wire & Injury Sync"

on:
  schedule:
    # Nightly at 1:17 AM EST (06:17 UTC) during NFL season months (Sep-Dec, Jan)
    # Uses off-peak minute (:17) to avoid GitHub's top-of-the-hour (:00) cron queue delays
    - cron: "17 6 * 9-12,1 *"

  workflow_dispatch:
    inputs:
      year:
        description: "Season year (optional, leave blank to auto-resolve from vffl.leagues)"
        required: false
        type: string
      week:
        description: "Week number (optional, leave blank to auto-resolve from vffl.leagues)"
        required: false
        type: string

concurrency:
  group: vfsn-tier2-wire-injury
  cancel-in-progress: false

jobs:
  run-tier2-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ESPN_LEAGUE_ID_RED: ${{ secrets.ESPN_LEAGUE_ID_RED }}
      ESPN_LEAGUE_ID_BLACK: ${{ secrets.ESPN_LEAGUE_ID_BLACK }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install espn-api psycopg2-binary python-dotenv requests

      - name: Execute Tier 2 (Nightly Wire & Injury) Pipeline
        run: |
          if [ -n "${{ inputs.year }}" ] && [ -n "${{ inputs.week }}" ]; then
            python scripts/vffl_wire_injury_pipeline.py "${{ inputs.year }}" "${{ inputs.week }}"
          elif [ -n "${{ inputs.year }}" ]; then
            python scripts/vffl_wire_injury_pipeline.py "${{ inputs.year }}"
          else
            python scripts/vffl_wire_injury_pipeline.py
          fi

